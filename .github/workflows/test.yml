name: test

on:
  push:
  pull_request:

jobs:
  test:
    name: 跑測試
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 把這份專案複製到 GitHub 的機器
        uses: actions/checkout@v4

      - name: 安裝 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: 啟動 PostgreSQL、Redis、Kafka、Mailpit
        run: docker compose up -d --wait --wait-timeout 180

      - name: 執行 ./gradlew test
        run: ./gradlew test --no-daemon
