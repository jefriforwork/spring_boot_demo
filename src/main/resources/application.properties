spring.application.name=demo

# 錯誤回應只回狀態與訊息，不把 stack trace 回給呼叫端
server.error.include-stacktrace=never
server.error.include-message=never

# 關閉 Spring Boot Docker Compose 自動管理
spring.docker.compose.enabled=false

# 主庫（寫入）資料源
app.datasource.primary.url=jdbc:postgresql://localhost:5432/mydb
app.datasource.primary.username=postgres
app.datasource.primary.password=postgres
app.datasource.primary.driver-class-name=org.postgresql.Driver

# 從庫（讀取）資料源
app.datasource.replica.url=jdbc:postgresql://localhost:5433/mydb
app.datasource.replica.username=postgres
app.datasource.replica.password=postgres
app.datasource.replica.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway — 只指向主庫
spring.flyway.enabled=true
spring.flyway.url=jdbc:postgresql://localhost:5432/mydb
spring.flyway.user=postgres
spring.flyway.password=postgres
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Spring Cache
spring.cache.type=redis
spring.cache.redis.time-to-live=10m

# Cache logging
logging.level.org.springframework.cache=DEBUG

# JWT（HS256，單一服務）
app.security.jwt.secret=demo-secret-key-must-be-32-bytes!
app.security.jwt.access-token-ttl=15m
app.security.jwt.issuer=demo
app.security.jwt.audience=demo-api

# 邀請信（本機 Mailpit：SMTP 1025，信件介面 http://localhost:8025）
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

app.invite.ttl=48h
app.invite.from=noreply@demo.local
app.invite.accept-url=http://localhost:8080/api/v1/auth/accept-invite

# Kafka
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=book-group
spring.kafka.consumer.auto-offset-reset=earliest

# Simulate slow notification work so API returns while Kafka drains the queue
app.kafka.notification-delay-ms=500
